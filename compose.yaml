services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: aniimo-uid-topup-api:local
    container_name: aniimo-uid-topup-api
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      VERIFY_PROVIDER: "${VERIFY_PROVIDER:-mock}"
      ANIIMO_UID_VERIFY_URL: "${ANIIMO_UID_VERIFY_URL:-}"
      ANIIMO_UPSTREAM_TOKEN: "${ANIIMO_UPSTREAM_TOKEN:-}"
      ANIIMO_SIGNING_SECRET: "${ANIIMO_SIGNING_SECRET:-}"
      ANIIMO_TIMEOUT_MS: "${ANIIMO_TIMEOUT_MS:-5000}"
      ANIIMO_MAX_RETRIES: "${ANIIMO_MAX_RETRIES:-2}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      RATE_LIMIT_MAX: "${RATE_LIMIT_MAX:-30}"
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS:-900}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

